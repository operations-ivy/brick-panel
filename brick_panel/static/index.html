<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480, height=800, initial-scale=1, user-scalable=no">
<title>brick1982</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/panel.css">
</head>
<body>
<div id="stage">

  <!-- HOME: the middle of the plus -->
  <section class="screen live" data-screen="home">
    <canvas class="city" width="480" height="430"></canvas>
    <div class="sky stars"></div>
    <div class="windows"></div>
    <div class="car"><i></i></div>
    <div class="sign brick-sign"><span>B</span><span>R</span><span>I</span><span>C</span><span>K</span></div>
    <div class="billboards"></div>
    <div class="rain far"></div>
    <div class="rain near"></div>
    <div class="snow far"></div>
    <div class="snow near"></div>
    <div class="flash"></div>
    <svg class="bolt" viewBox="0 0 40 120" width="40" height="120" aria-hidden="true">
      <polyline points="22,0 12,46 24,50 8,120 30,58 18,54 30,0" />
    </svg>

    <header class="topbar">
      <div class="logo" data-text="STRAYLIGHT">STRAYLIGHT</div>
      <div class="link"><i class="led"></i><span class="link-text">LINK</span></div>
    </header>

    <div class="clock">
      <div class="time" data-text="--:--">--:--</div>
      <div class="ampm"></div>
    </div>
    <div class="date">--- -- ---</div>
    <div class="forecast">
      <div class="now"><span class="temp">--°</span><span class="cond">NO SIGNAL</span></div>
      <div class="next"></div>
    </div>
  </section>

  <!-- The plus's arms and the billboards' screens, filled by panel.js -->
  <section class="screen app" data-screen="weather"></section>
  <section class="screen app" data-screen="climate"></section>
  <section class="screen app" data-screen="lights"></section>
  <section class="screen app" data-screen="brick"></section>
  <section class="screen app" data-screen="alerts"></section>
  <section class="screen app" data-screen="calendar"></section>
  <section class="screen app" data-screen="shopping"></section>
  <section class="screen app" data-screen="settings"></section>

  <div id="hints"></div>
  <button id="mute" hidden aria-label="Mute">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path class="cone" d="M3 9h4l5-4v14l-5-4H3z" />
      <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
      <path class="cross" d="M15 9l6 6M21 9l-6 6" />
    </svg>
  </button>
  <div id="static"></div>
  <div id="crt"></div>
  <div id="night"></div>
</div>
<script src="/static/scene.js"></script>
<script src="/static/apps.js"></script>
<script src="/static/controls.js"></script>
<script src="/static/household.js"></script>
<script src="/static/sound.js"></script>
<script src="/static/pizazz.js"></script>
<script src="/static/rum.js"></script>
<script src="/static/panel.js"></script>
</body>
</html>
