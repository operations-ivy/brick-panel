# brick-panel's settings. Change one on a panel by putting just that key in
# ~/.config/brick-panel/settings.yaml (not in git): it's merged over these.

server:
  # The page, its state and /metrics (Prometheus' job, as LCARS' was).
  host: 0.0.0.0
  port: 8767

kiosk:
  # The panel's output and its rotation, as wlr-randr's --transform (touch
  # follows). The 7" panel is 800x480; turned 90 degrees clockwise on the
  # wall, it's upright at 270 (seen on brick1982, 2026-11-22). Use 90 if the
  # panel is turned the other way.
  output: DSI-1
  rotation: 270

clock:
  hours: 12  # or 24

weather:
  # "lat,lon" for the forecast. Where the panel is, so only in the panel's own
  # settings file, never here.
  point: ""
  poll_seconds: 300

feeds:
  # The homelab's pages the panel reads. An empty url turns one off (its
  # part of the screen says so). A feed's last answer is shown for
  # stale_seconds after its source stops answering, then it reads OFFLINE.
  stale_seconds: 300
  sources:
    # brick9000's board: the BRICK screen.
    board:
      url: https://status.brick.nozdormu.cloud/api/state
      poll_seconds: 30
    # Firing alerts and overwatch: the ALERTS screen, with the weather's warnings.
    prometheus:
      url: https://prometheus.brick.nozdormu.cloud/api/v1/alerts
      poll_seconds: 30
    overwatch:
      url: https://overwatch.brick.nozdormu.cloud/api/state
      poll_seconds: 30

home_assistant:
  # CLIMATE and LIGHTS. The token is the Panel user's long-lived token (as
  # LCARS'), so only in the panel's own settings file, never here. Empty: the
  # two screens say NO TOKEN.
  url: https://homeassistant.brick.nozdormu.cloud
  token: ""
  poll_seconds: 5

climate:
  thermostat: climate.thermostat
  # Show the thermostat, never change it: no keypad, no calls go out.
  read_only: false
  # The code that opens the controls (CLIMATE and LIGHTS). Only in the
  # panel's own settings file. Empty: only Home Assistant can open them
  # (lock_entity: unlocked).
  pin: ""
  # Back to locked after this long without a touch.
  idle_relock_seconds: 120
  # Wrong codes in a row before a lockout; the lockout doubles each time
  # after, up to the maximum, until a right code.
  misses_before_lockout: 3
  lockout_seconds: 30
  max_lockout_seconds: 600
  # Shared with LCARS: normal, unlocked (no code needed) or hard_locked
  # (even the right code is refused).
  lock_entity: input_select.lcars_panel_lock
  # Home Assistant's guardrails for the setpoints, and these until it answers.
  setpoint_min_entity: input_number.thermostat_setpoint_min
  setpoint_max_entity: input_number.thermostat_setpoint_max
  default_guardrails: [64, 76]
  # Auto keeps heat and cool at least this far apart.
  heat_cool_gap: 5
  # Taps gather this long before one call goes to Home Assistant.
  send_after_seconds: 1.5

lights:
  # Home Assistant light entities and the names to show (empty: Home
  # Assistant's names), in order.
  entities: {}
  step_pct: 10

calendar:
  # CALENDAR: Home Assistant calendar entities (e.g. Google Calendar through
  # its integration). Their names can say where the house is, so they go only
  # in the panel's own settings file, never here. Empty: CALENDAR says so.
  entities: []
  # This month and the months after it, fetched every poll_seconds; events
  # older than stale_seconds are shown with how old they are.
  months: 2
  poll_seconds: 300
  stale_seconds: 1800

shopping:
  # SHOPPING: Home Assistant's to-do list. Empty: SHOPPING says so.
  entity: todo.shopping_list
  poll_seconds: 30

sound:
  # The panel's sounds, made by the page (static/sound.js). These are the
  # defaults; what's ticked in SETTINGS (a tap on the STRAYLIGHT logo) is
  # saved in file and wins. level: low or medium (both under brick1982's
  # ALSA cap). quiet_hours: muted then, in guest mode (the night's format;
  # empty: never).
  # The mute button, on every screen, flips that until the next change:
  # unmuted in quiet hours until they end, muted by day until they start.
  file: ~/.config/brick-panel/sound.yaml
  level: medium
  quiet_hours: "18:00-08:00"
  events:
    tap: true
    screen: true
    pin_key: true
    pin_ok: true
    pin_bad: true
    alert: true
    surprise_plane: true
    surprise_lights: true
    surprise_sign: true

guest:
  # Office or guest mode (guest.py). Office (on: false): the screen always
  # on unless a double tap sleeps it, the sound never muted on a timer. Guest
  # (on: true): night's window and dim, and sound's quiet_hours, apply.
  # SETTINGS switches it; the choice is saved in file and wins.
  on: false
  file: ~/.config/brick-panel/guest.yaml

night:
  # When the screen is on (night.py), in guest mode; in office mode it's
  # always on unless double-tapped asleep. A double tap always sleeps or wakes
  # it. In window it's asleep unless double-tapped awake, and it sleeps again
  # idle_seconds after the last touch. Woken in dim, the backlight is level
  # (0-1), otherwise day_level. Windows: "HH:MM-HH:MM" (may wrap past
  # midnight), either end may be sunset or sunrise (Home Assistant's
  # sun.sun); empty: never. Going dark locks the controls.
  window: "18:00-07:00"
  dim: "22:00-07:00"
  level: 0.6
  day_level: 1.0
  idle_seconds: 300
  sun_entity: sun.sun

room:
  # The room sensor on the Pi's I2C bus: upstairs on CLIMATE, and /room.json
  # for Home Assistant's sensor.bedroom_*. chip: sht3x (an SHT30/31/35) or
  # bme280 (the Pimoroni Multi-Sensor Stick's, which adds air pressure).
  # i2c_address: null for the chip's usual one (0x44, 0x76). The Pi warms the
  # air near it: offset (degrees F) corrects that, measured once against a
  # thermometer.
  sensor: false
  chip: sht3x
  i2c_bus: 1
  i2c_address: null
  offset: 0
  poll_seconds: 30

# The plus: Home in the middle, an app on each arm. Swap names to rearrange.
plus:
  up: weather
  right: climate
  down: lights
  left: brick

# Home's billboards; each opens its screen. They stand on the rooftops, left
# to right, except the one named by hanging, which hangs on chains from the
# top edge (empty: none hangs).
billboards: [alerts, calendar, shopping]
hanging: alerts

perf:
  # A frame later than budget x late_factor is late (one missed vsync).
  frame_budget_ms: 16.7
  late_factor: 1.5
  # deploy/bench fails over either of these.
  bench_p95_ms: 20
  bench_late_ratio: 0.05
  bench_rounds: 3
