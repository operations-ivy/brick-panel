[tool.poetry]
name = "brick_panel"
version = "0.1.0"
description = "brick1982's neon wall panel: a portrait touchscreen UI in Chromium, served from the Pi itself"
authors = ["Patrick White <whitep@alumni.vcu.edu>"]
packages = [{ include = "brick_panel" }]

# On brick1982 everything comes from Debian (python3-yaml, python3-pytest):
# no venv to build on the Pi. Poetry is for the laptop.
[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
pytest = "^8.3.5"

[build-system]
requires = ["poetry>=1.3.2"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Imports only: flake8 does the linting (.pre-commit-config.yaml).
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
required-imports = ["from __future__ import annotations"]
known-first-party = ["tests"]
